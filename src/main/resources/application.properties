spring.application.name=techlab-ecommerce

# Perfil activo por defecto: H2 (en memoria, para pruebas).
# Para la entrega con MySQL, ejecutar con:  --spring.profiles.active=mysql
spring.profiles.active=h2

# Configuracion comun de JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Mantiene la sesion abierta durante el request para poder serializar
# las relaciones lazy (lineas de pedido) al mapear a los DTOs.
spring.jpa.open-in-view=true

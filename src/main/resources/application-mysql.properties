# Perfil MySQL - base de datos principal para la entrega final
# Crear la base vacia antes de arrancar:  CREATE DATABASE techlab;
# Ajusta usuario y password segun tu instalacion local de MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/techlab?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
